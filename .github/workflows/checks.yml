name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv build
      - run: |
          for artifact in dist/*; do
            python3 scripts/release_check.py "$artifact"
          done
      - run: |
          python3 scripts/export-public.py "$RUNNER_TEMP/candidate" --init-git > "$RUNNER_TEMP/export.json"
          python3 scripts/release_check.py "$RUNNER_TEMP/candidate"
